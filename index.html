<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Alert</title>
    <style>
      body {
        background-color: #0d0208;
        color: #00ff66;
        font-family: "Courier New", Courier, monospace;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        /* Tambahkan padding agar di HP tidak mentok ke pinggir layar */
        padding: 20px;
        box-sizing: border-box;
      }
      .terminal {
        background: rgba(0, 20, 0, 0.85);
        border: 1px solid #00ff66;
        box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
        padding: 25px;
        border-radius: 8px;
        /* Ubah max-width dan width agar fleksibel di layar kecil */
        width: 100%;
        max-width: 450px;
        text-align: left;
        box-sizing: border-box;
      }
      h1 {
        color: #ff0055;
        font-size: 18px; /* Sedikit dikecilkan agar aman di layar HP kecil */
        margin-bottom: 15px;
        text-transform: uppercase;
      }
      p {
        font-size: 13px; /* Menyesuaikan agar nyaman dibaca di mobile */
        line-height: 1.6;
        margin-bottom: 20px;
        color: #c7f9cc;
      }
      .cursor {
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0%,
        50% {
          opacity: 1;
        }
        51%,
        100% {
          opacity: 0;
        }
      }
      .btn {
        display: block;
        width: 100%;
        background-color: #00ff66;
        color: #0d0208;
        text-align: center;
        padding: 12px;
        font-weight: bold;
        text-decoration: none;
        border-radius: 4px;
        margin-top: 20px;
        transition: background 0.2s;
        box-sizing: border-box;
      }
      .btn:hover {
        background-color: #00cc52;
      }
    </style>
  </head>
  <body>
    <div class="terminal">
      <h1>⚠️ Warning: System Override</h1>
      <p>
        > Initializing security protocol...<br />
        > Detecting unknown device...<br />
        > <strong>Peringatan:</strong> Perangkat Anda mendadak kedatangan rezeki
        nomplok tanpa izin!<span class="cursor">_</span>
      </p>
      <a
        href="https://link.dana.id/danakaget?c=sn7ycbcxu&r=f92uOk&orderId=20261109101214521515010300166380106714313"
        class="btn"
        target="_blank"
        >[ AMANKAN SALDO SEKARANG ]</a
      >
    </div>
  </body>
</html>
